trigger:
  branches:
    include:
      - main
      - '*'

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: ourchive/neteservice

stages:
  - stage: Test
    displayName: Run Tests
    jobs:
      - job: RunTests
        displayName: 'Run Pytest'
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.x'
              addToPath: true

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: 'Install dependencies'

          - script: |
              pytest .
            displayName: 'Run tests'

  - stage: Build
    displayName: Build and Push Docker Image
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: BuildAndPush
        displayName: 'Build and push image if on main'
        steps:
          - checkout: self

          - task: Docker@2
            displayName: 'Build Docker image'
            inputs:
              containerRegistry: ''
              repository: $(imageName)
              command: build
              Dockerfile: '**/Dockerfile'
              tags: |
                $(Build.BuildId)

          - task: Docker@2
            displayName: 'Login to Docker Hub'
            inputs:
              command: login
              containerRegistry: 'DockerHubConnection'  # <-- Set up in Azure DevOps > Service Connections

          - task: Docker@2
            displayName: 'Push image to Docker Hub'
            condition: eq(variables['Build.SourceBranchName'], 'main')
            inputs:
              containerRegistry: 'DockerHubConnection'
              repository: $(imageName)
              command: push
              tags: |
                $(Build.BuildId)
                latest
