trigger:
  branches:
    include:
      - main
      - '*'

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: madecunningly/nete-service

stages:
  - stage: Test
    displayName: Run Tests
    jobs:
      - job: RunTests
        displayName: 'Run Pytest'
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.x'
              addToPath: true

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install pytest
            displayName: 'Install dependencies'

          - script: |
              pytest .
            displayName: 'Run tests'
            env:
              ARTIFACT_DIR: $(Build.ArtifactStagingDirectory)

  - stage: Build
    displayName: Build and Push Docker Image
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: BuildAndPush
        displayName: 'Build, push and publish image'
        steps:
          - checkout: self

          - task: Docker@2
            displayName: 'Login to Docker Hub'
            inputs:
              containerRegistry: 'madecunningly@dockerhub'
              command: 'login'

          - task: Docker@2
            displayName: 'Build Docker image'
            inputs:
              containerRegistry: 'madecunningly@dockerhub'
              repository: $(imageName)
              command: build
              Dockerfile: '**/Dockerfile'
              tags: |
                $(Build.BuildId)

          # ✅ Save the image as a .tar file
          - script: |
              docker save $(imageName):$(Build.BuildId) -o $(Build.ArtifactStagingDirectory)/nete-service.tar
            displayName: 'Save Docker image as tar'

          # ✅ Publish the .tar as a pipeline artifact
          - publish: $(Build.ArtifactStagingDirectory)/nete-service.tar
            artifact: docker-image

          # ✅ Push only if main
          - task: Docker@2
            displayName: 'Push image to Docker Hub'
            condition: eq(variables['Build.SourceBranchName'], 'main')
            inputs:
              containerRegistry: 'madecunningly@dockerhub'
              repository: $(imageName)
              command: push
              tags: |
                $(Build.BuildId)
                latest
